plugins {
    id 'com.android.application'
}

android {
    namespace 'app.shadowcode'
    compileSdk 35

    defaultConfig {
        applicationId 'app.shadowcode'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.0.2'
        resConfigs 'en'
    }

    signingConfigs {
        release {
            // shipped builds are signed with the standard debug key so anyone can
            // sideload them; swap in your own keystore for a store release.
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/*']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
