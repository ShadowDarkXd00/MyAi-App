<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06070B" />
    <meta name="color-scheme" content="dark light" />
    <title>ShadowCode</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html, body { margin: 0; height: 100%; background: #06070B; color: #eef0f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #boot { display: none; padding: 28px 22px; box-sizing: border-box; }
      #boot h1 { font-size: 20px; margin: 14px 0 8px; letter-spacing: -0.02em; }
      #boot p { font-size: 13.5px; line-height: 1.6; color: #9aa1b4; margin: 0 0 14px; }
      #boot pre { font: 11px/1.5 ui-monospace, Menlo, monospace; color: #9aa1b4; white-space: pre-wrap;
        word-break: break-word; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09);
        border-radius: 14px; padding: 12px; max-height: 46vh; overflow: auto; }
      #boot .dot { width: 40px; height: 40px; border-radius: 14px;
        background: linear-gradient(135deg, #7C5CFF, #22D3EE); }
      #boot button { height: 46px; width: 100%; margin-top: 14px; border: 0; border-radius: 24px;
        color: #fff; font-size: 15px; font-weight: 600;
        background: linear-gradient(135deg, #7C5CFF, #22D3EE); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div class="dot"></div>
      <h1>ShadowCode could not start its interface</h1>
      <p>The web engine on this device may be too old, or a script failed. This text is generated by the
        bootstrap watchdog, so it works even when the app itself cannot run.</p>
      <pre id="boot-detail"></pre>
      <button onclick="location.reload()">Reload the app</button>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /* ES5 on purpose: must run on any WebView. */
      (function () {
        var shown = false;
        function detail() {
          var ua = navigator.userAgent || 'unknown';
          return 'build 1.0.2\nUA: ' + ua +
            '\nwindow: ' + window.innerWidth + 'x' + window.innerHeight +
            '\nroot children: ' + (document.getElementById('root').children.length) +
            '\nmodule scripts supported: ' + ('noModule' in document.createElement('script')) +
            '\npromise: ' + (typeof Promise) + '  fetch: ' + (typeof fetch);
        }
        function show() {
          if (shown) return;
          var root = document.getElementById('root');
          if (root && root.children.length > 0) return; // app booted
          shown = true;
          var el = document.getElementById('boot-detail');
          if (el) el.textContent = detail();
          var b = document.getElementById('boot');
          if (b) b.style.display = 'block';
        }
        window.__scBootWatch = setTimeout(show, 6000);
        window.addEventListener('load', function () { setTimeout(show, 2500); });
      })();
    </script>
  </body>
</html>
